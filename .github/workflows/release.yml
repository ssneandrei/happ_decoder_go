name: Build and Release Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
    - name: Install dependencies
        run: go mod tidy

      - name: Build Binaries for OpenWrt
        run: |
          mkdir -p dist
          # ARM64 (MediaTek Filogic, Raspberry Pi, etc.)
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/happ-decoder-linux-arm64 main.go
          # MIPSLE (Xiaomi, Keenetic, etc.)
          CGO_ENABLED=0 GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -ldflags="-s -w" -o dist/happ-decoder-linux-mipsle main.go
          # x86_64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/happ-decoder-linux-amd64 main.go


      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
