name: Build and Release APK Package
on:
  push:
    tags:
      - 'v*'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      
      - name: Install abuild dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y abuild xz-utils
      
      - name: Go Mod Tidy
        run: go mod tidy
      
      - name: Build Go Binary
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o happ-decoder main.go
      
      - name: Create APK package structure
        run: |
          mkdir -p pkg/usr/bin
          mkdir -p pkg/etc/config
          mkdir -p pkg/etc/init.d
          mkdir -p pkg/usr/share/luci/menu.d
          mkdir -p pkg/usr/share/rpcd/acl.d
          mkdir -p pkg/www/luci-static/resources/view/happ-decoder
          mkdir -p output
          
          # Copy binary
          cp happ-decoder pkg/usr/bin/
          chmod +x pkg/usr/bin/happ-decoder
          
          # Copy config files if they exist
          [ -f root/etc/config/happ-decoder ] && cp root/etc/config/happ-decoder pkg/etc/config/ || true
          [ -f root/etc/init.d/happ-decoder ] && cp root/etc/init.d/happ-decoder pkg/etc/init.d/ || true
          
          # Copy LuCI files if they exist (исправьте имена файлов!)
          [ -f root/usr/share/luci/menu.d/happ-decoder.json ] && cp root/usr/share/luci/menu.d/happ-decoder.json pkg/usr/share/luci/menu.d/ || true
          [ -f root/usr/share/rpcd/acl.d/happ-decoder.json ] && cp root/usr/share/rpcd/acl.d/happ-decoder.json pkg/usr/share/rpcd/acl.d/ || true
          [ -f htdocs/luci-static/resources/view/happ-decoder/happ-decoder.js ] && cp htdocs/luci-static/resources/view/happ-decoder/happ-decoder.js pkg/www/luci-static/resources/view/happ-decoder/ || true
      
      - name: Build APK package
        run: |
          cd pkg
          
          # Create PKGINFO
          cat > .PKGINFO << EOF
          pkgname = luci-app-happ-decoder
          pkgver = 1.0.0-r1
          pkgdesc = LuCI support for Happ Decoder
          url = https://github.com/ssneandrei/happ_decoder_go
          arch = aarch64
          size = $(du -b . | cut -f1)
          EOF
          
          # Create control.tar.gz
          tar -czf control.tar.gz .PKGINFO
          
          # Create data.tar.xz
          tar -cJf data.tar.xz usr etc www
          
          # Create final APK (это просто tar archive)
          cat control.tar.gz data.tar.xz > ../output/luci-app-happ-decoder_1.0.0_aarch64.apk
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            happ-decoder
            output/*.apk
      
      - uses: softprops/action-gh-release@v1
        with:
          files: |
            happ-decoder
            output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
