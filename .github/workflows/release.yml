name: Build and Release APK Package

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Download Go modules
        run: |
          go mod download
          go get golang.org/x/crypto/chacha20poly1305
          go mod tidy

      - name: Build Go binary
        run: |
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o happ-decoder main.go

      - name: Build APK v3 Package in OpenWrt Docker
        run: |
          docker run --rm -v ${{ github.workspace }}:/builder/package/happ-decoder \
            openwrt/sdk:aarch64_cortex-a53-openwrt-25.12 \
            make package/happ-decoder/compile V=s

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            happ-decoder
            bin/packages/aarch64_cortex-a53/base/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


