name: Build and Release APK Package
on:
  push:
    tags:
      - 'v*'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Go Mod Tidy
        run: go mod tidy
      - name: Build Go Binary
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o happ-decoder main.go
      - name: Pack APK v3
        run: |
          sudo apt-get update && sudo apt-get install -y abuild
          mkdir -p pkg/usr/bin pkg/etc/config pkg/etc/init.d pkg/usr/share/luci/menu.d pkg/usr/share/rpcd/acl.d pkg/www/luci-static/resources/view/happ-decoder output
          cp happ-decoder pkg/usr/bin/
          [ -f root/etc/config/happ-decoder ] && cp root/etc/config/happ-decoder pkg/etc/config/ || true
          [ -f root/etc/init.d/happ-decoder ] && cp root/etc/init.d/happ-decoder pkg/etc/init.d/ || true
          cp root/usr/share/luci/menu.d/.json pkg/usr/share/luci/menu.d/ 2>/dev/null || true
          cp root/usr/share/rpcd/acl.d/.json pkg/usr/share/rpcd/acl.d/ 2>/dev/null || true
          cp htdocs/luci-static/resources/view/happ-decoder/.js pkg/www/luci-static/resources/view/happ-decoder/ 2>/dev/null || true
          chmod +x pkg/usr/bin/happ-decoder pkg/etc/init.d/ 2>/dev/null || true
          printf "pkgname = luci-app-happ-decoder\npkgver = 1.0.0-r1\npkgdesc = LuCI support for Happ Decoder\nurl = https://github.com/ssneandrei/happ_decoder_go\narch = aarch64\nsize = 5000000\ndepend = ca-bundle\n" > pkg/.PKGINFO
          cd pkg
          tar -c .PKGINFO | abuild-tar --cut | gzip -9 > control.tar.gz
          tar -c usr etc www | abuild-tar --cut | xz -9 > data.tar.xz
          cat control.tar.gz data.tar.xz > ../output/luci-app-happ-decoder_1.0.0_aarch64.apk
      - uses: softprops/action-gh-release@v1
        with:
          files: |
            happ-decoder
            output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
