name: Build and Release APK Package

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Go binaries
        run: |
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o happ-decoder_aarch64 main.go
          GOOS=linux GOARCH=mipsle CGO_ENABLED=0 go build -ldflags="-s -w" -o happ-decoder_mips main.go
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o happ-decoder_x86_64 main.go

      - name: Build APK Packages v3 via OpenWrt SDK
        uses: openwrt/gh-action-sdk@v1
        with:
          archetype: aarch64_cortex-a53
          tag: v25.12.0

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            happ-decoder_*
            bin/packages/*/*/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
